<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">CodeCrafters</title>
  <desc id="description">CodeCrafters logo and name on a neon green pixel-grid background.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#05070a" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="16" dy="20" stdDeviation="14" flood-color="#05070a" flood-opacity=".24"/>
    </filter>
    <linearGradient id="wordmark" x1="0" x2="1">
      <stop offset="0" stop-color="#3f4448"/>
      <stop offset=".34" stop-color="#171a1d"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" rx="32" fill="#91f108"/>
  <rect width="1600" height="480" rx="32" fill="url(#grid)"/>

  <g fill="#fff" opacity=".3">
    <path d="M0 0h128v64H64v64H0z"/>
    <path d="M1472 352h128v128h-64v-64h-64z"/>
    <path d="M1344 0h128v64h64v64h-128V64h-64z"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M220 100a140 140 0 0 1 0 280z" fill="#111416"/>
    <path d="M108 174a66 66 0 0 1 0 132z" fill="#22272a"/>
    <path d="M220 100v280" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5"/>
    <path d="M108 174v132" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/>
  </g>

  <text x="430" y="285" fill="url(#wordmark)" font-family="Inter, Arial, Helvetica, sans-serif" font-size="150" font-weight="700" letter-spacing="-7">CodeCrafters</text>
  <text x="1430" y="178" fill="#05070a" font-family="Inter, Arial, Helvetica, sans-serif" font-size="40" font-weight="700">TM</text>
  <text x="438" y="362" fill="#05070a" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="9">YOU IMAGINE. WE BUILD.</text>

  <rect x="16" y="16" width="1568" height="448" rx="22" fill="none" stroke="#05070a" stroke-opacity=".2" stroke-width="2"/>
</svg>
